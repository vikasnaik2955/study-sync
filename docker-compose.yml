# Spins up MySQL for local dev. The backend creates/updates the schema on boot (Hibernate
# ddl-auto=update) and seeds default subjects, so this is the only infrastructure you need
# running before `mvnw spring-boot:run`. Prefer a local MySQL install? See RUNNING.md.
services:
  db:
    image: mysql:8.4
    container_name: studysync-db
    environment:
      MYSQL_DATABASE: studysync
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - studysync-mysqldata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  studysync-mysqldata:
